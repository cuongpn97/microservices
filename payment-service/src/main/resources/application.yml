server:
  port: ${SERVER_PORT:8085}
  shutdown: graceful

spring:
  application:
    name: payment-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payment_db}
    username: ${DB_USERNAME:payment_user}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:webshop}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 10
        default-requeue-rejected: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

webshop:
  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER:webshop-auth}
  wallet:
    initial-credit-vnd: ${WALLET_INITIAL_CREDIT_VND:10000000}
  messaging:
    retry:
      max-attempts: ${MESSAGE_RETRY_MAX_ATTEMPTS:4}
      initial-delay: ${MESSAGE_RETRY_INITIAL_DELAY:1s}
      multiplier: ${MESSAGE_RETRY_MULTIPLIER:3}
      max-delay: ${MESSAGE_RETRY_MAX_DELAY:30s}
      jitter-factor: 0.2
