# Môi trường local đầy đủ: 1 PostgreSQL (7 database tách biệt), 1 RabbitMQ, 1 SeaweedFS (ảnh sản phẩm, S3 API), 8 service + 2 UI.
#   cp .env.example .env
#   ./mvnw -B package -DskipTests
#   docker compose up -d --build
name: webshop

x-service-common: &service-common
  restart: unless-stopped
  mem_limit: 512m
  depends_on:
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy

x-service-env: &service-env
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
  JWT_SECRET: ${JWT_SECRET}
  JWT_ISSUER: ${JWT_ISSUER:-webshop-auth}
  LOGGING_STRUCTURED_FORMAT_CONSOLE: ${LOG_FORMAT:-ecs}
  PRODUCT_SERVICE_URL: http://product-service:8082
  CART_SERVICE_URL: http://cart-service:8083

services:
  postgres:
    image: postgres:16-alpine
    # wal_level=logical: cho phép Debezium đọc thay đổi qua logical decoding (profile search).
    # max_slot_wal_keep_size: trần WAL giữ lại cho replication slot — nếu Debezium tắt lâu, slot bị vô hiệu hóa
    # (phải snapshot lại) thay vì WAL phình tới đầy đĩa và làm sập CẢ sáu database.
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=10", "-c", "max_wal_senders=10",
              "-c", "max_slot_wal_keep_size=1GB"]
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      PRODUCT_DB_PASSWORD: ${PRODUCT_DB_PASSWORD}
      CART_DB_PASSWORD: ${CART_DB_PASSWORD}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD}
      REVIEW_DB_PASSWORD: ${REVIEW_DB_PASSWORD}
      CDC_DB_PASSWORD: ${CDC_DB_PASSWORD:-}
    volumes:
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"   # Management UI: http://localhost:15672
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Object storage tương thích S3 cho ảnh sản phẩm (SeaweedFS, Apache 2.0). MinIO đã ngừng phát hành image cộng đồng
  # (cuối 2025), nên dùng SeaweedFS — product-service chỉ nói S3 API, đổi nhà cung cấp không đổi code.
  # Quyền: start.sh sinh định danh từ S3_ACCESS_KEY/S3_SECRET_KEY (ghi) + anonymous chỉ ĐỌC bucket ảnh.
  # Bucket do product-service tự tạo lúc khởi động.
  object-storage:
    image: chrislusf/seaweedfs:4.50
    entrypoint: ["sh", "/seaweedfs/start.sh"]
    restart: unless-stopped
    mem_limit: 512m
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: product-images
    ports:
      - "8333:8333"   # S3 API — trình duyệt tải ảnh trực tiếp từ đây
    volumes:
      - ./infra/seaweedfs:/seaweedfs:ro
      - objectdata:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 30

  auth-service:
    <<: *service-common
    build: ./auth-service
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/auth_db
      DB_USERNAME: auth_user
      DB_PASSWORD: ${AUTH_DB_PASSWORD}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-PT30M}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "8081:8081"

  product-service:
    <<: *service-common
    build: ./product-service
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      object-storage:
        condition: service_healthy
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/product_db
      DB_USERNAME: product_user
      DB_PASSWORD: ${PRODUCT_DB_PASSWORD}
      # Ghi qua mạng nội bộ compose; trình duyệt đọc ảnh qua cổng 8333 đã publish ra host.
      STORAGE_ENDPOINT: http://object-storage:8333
      STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL:-http://localhost:8333/product-images}
      STORAGE_ACCESS_KEY: ${S3_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${S3_SECRET_KEY}
    ports:
      - "8082:8082"

  cart-service:
    <<: *service-common
    build: ./cart-service
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/cart_db
      DB_USERNAME: cart_user
      DB_PASSWORD: ${CART_DB_PASSWORD}
    ports:
      - "8083:8083"

  inventory-service:
    <<: *service-common
    build: ./inventory-service
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/inventory_db
      DB_USERNAME: inventory_user
      DB_PASSWORD: ${INVENTORY_DB_PASSWORD}
    ports:
      - "8084:8084"

  payment-service:
    <<: *service-common
    build: ./payment-service
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/payment_db
      DB_USERNAME: payment_user
      DB_PASSWORD: ${PAYMENT_DB_PASSWORD}
    ports:
      - "8085:8085"

  order-service:
    <<: *service-common
    build: ./order-service
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/order_db
      DB_USERNAME: order_user
      DB_PASSWORD: ${ORDER_DB_PASSWORD}
      SAGA_STEP_TIMEOUT: ${SAGA_STEP_TIMEOUT:-15s}
      SAGA_MAX_RESERVE_ATTEMPTS: ${SAGA_MAX_RESERVE_ATTEMPTS:-3}
    ports:
      - "8086:8086"

  review-service:
    <<: *service-common
    build: ./review-service
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/review_db
      DB_USERNAME: review_user
      DB_PASSWORD: ${REVIEW_DB_PASSWORD}
    ports:
      - "8088:8088"

  api-gateway:
    build: ./api-gateway
    restart: unless-stopped
    mem_limit: 512m
    environment:
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-webshop-auth}
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ${LOG_FORMAT:-ecs}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001}
      AUTH_SERVICE_URL: http://auth-service:8081
      PRODUCT_SERVICE_URL: http://product-service:8082
      CART_SERVICE_URL: http://cart-service:8083
      INVENTORY_SERVICE_URL: http://inventory-service:8084
      PAYMENT_SERVICE_URL: http://payment-service:8085
      ORDER_SERVICE_URL: http://order-service:8086
      SEARCH_SERVICE_URL: http://search-service:8087
      REVIEW_SERVICE_URL: http://review-service:8088
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - product-service
      - cart-service
      - inventory-service
      - payment-service
      - order-service
      - review-service

  # Cửa hàng cho khách (Next.js). BFF chỉ chuyển tiếp tới API Gateway — không có đường tắt nào vào service.
  storefront-ui:
    build: ./storefront-ui
    restart: unless-stopped
    mem_limit: 256m
    environment:
      GATEWAY_URL: http://api-gateway:8080
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway

  # Backoffice cho nhân viên (Next.js): quản lý catalog/tồn kho/đánh giá qua gateway, và các trang vận hành gọi thẳng
  # /admin/** của từng service qua mạng nội bộ Docker (gateway cố ý không route /admin).
  backoffice-ui:
    build: ./backoffice-ui
    restart: unless-stopped
    mem_limit: 256m
    environment:
      GATEWAY_URL: http://api-gateway:8080
      AUTH_SERVICE_URL: http://auth-service:8081
      PRODUCT_SERVICE_URL: http://product-service:8082
      CART_SERVICE_URL: http://cart-service:8083
      INVENTORY_SERVICE_URL: http://inventory-service:8084
      PAYMENT_SERVICE_URL: http://payment-service:8085
      ORDER_SERVICE_URL: http://order-service:8086
      REVIEW_SERVICE_URL: http://review-service:8088
      RABBITMQ_MANAGEMENT_URL: http://rabbitmq:15672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    ports:
      - "3001:3000"
    depends_on:
      - api-gateway

  # ------------------------------------------------------------------ Search (CDC) — profile "search"
  #   docker compose --profile search up -d
  # Luồng: PostgreSQL WAL → Debezium (Kafka Connect) → Kafka → search-service → Elasticsearch.
  # Tách profile vì bộ này cần thêm ~2.5GB RAM; stack mặc định chạy được mà không có nó.

  kafka:
    image: apache/kafka:3.9.2
    profiles: ["search"]
    restart: unless-stopped
    mem_limit: 768m
    environment:
      # KRaft một node (không ZooKeeper): node vừa là broker vừa là controller.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    ports:
      - "29092:29092"   # từ máy host: localhost:29092
    # Không mount volume: image chạy bằng user không phải root, volume mới tạo thuộc root → broker không ghi được.
    # Mất dữ liệu Kafka khi xóa container là chấp nhận được ở local: Debezium thấy mất offset sẽ snapshot lại.
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.18.8
    profiles: ["search"]
    restart: unless-stopped
    mem_limit: 1g
    environment:
      discovery.type: single-node
      # LOCAL ONLY: tắt security để demo gọn. Production: bật xpack.security + TLS + user riêng cho search-service.
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30

  kafka-connect:
    image: quay.io/debezium/connect:3.5.2.Final
    profiles: ["search"]
    restart: unless-stopped
    mem_limit: 768m
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: webshop-connect
      # Kafka Connect lưu cấu hình connector, offset (vị trí LSN đã đọc) và trạng thái trong chính Kafka.
      CONFIG_STORAGE_TOPIC: _connect_configs
      OFFSET_STORAGE_TOPIC: _connect_offsets
      STATUS_STORAGE_TOPIC: _connect_statuses
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      # "${env:CDC_DB_PASSWORD}" trong JSON connector được thay bằng biến môi trường này → secret không nằm trong
      # cấu hình lưu ở topic _connect_configs.
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
      CDC_DB_PASSWORD: ${CDC_DB_PASSWORD:-}
      HEAP_OPTS: -Xms256m -Xmx512m
    ports:
      - "8090:8083"     # REST API Kafka Connect: http://localhost:8090/connectors
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30

  # Job chạy một lần: đăng ký connector rồi thoát (PUT idempotent nên chạy lại vô hại).
  connect-init:
    image: curlimages/curl:8.11.1
    profiles: ["search"]
    restart: "no"
    entrypoint: ["sh", "/debezium/register-connectors.sh"]
    volumes:
      - ./infra/debezium:/debezium:ro
    depends_on:
      kafka-connect:
        condition: service_healthy
      # Publication/GRANT do Flyway của product-service tạo → connector phải đăng ký SAU khi migration chạy xong.
      product-service:
        condition: service_healthy

  search-service:
    build: ./search-service
    profiles: ["search"]
    restart: unless-stopped
    mem_limit: 512m
    environment:
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-webshop-auth}
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ${LOG_FORMAT:-ecs}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ELASTICSEARCH_URIS: http://elasticsearch:9200
    ports:
      - "8087:8087"
    depends_on:
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

volumes:
  pgdata:
  rabbitdata:
  esdata:
  objectdata:
