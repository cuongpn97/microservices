server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          # Gateway KHÔNG retry: retry là trách nhiệm của client (với Idempotency-Key) và của service gọi service.
          # Retry ở nhiều tầng cùng lúc sẽ nhân số request (retry amplification).
          httpclient:
            connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:2000}
            response-timeout: ${GATEWAY_RESPONSE_TIMEOUT:10s}
          # Giới hạn kích thước body đặt THEO ROUTE thay vì default-filters: default filter cộng dồn với filter của route
          # (cả hai cùng chạy), nên không thể "nới" riêng cho route upload ảnh nếu giới hạn 1MB nằm ở default.
          routes:
            - id: auth
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/auth/**
              filters: &body-limit
                - name: RequestSize
                  args:
                    maxSize: ${GATEWAY_MAX_REQUEST_SIZE:1MB}
            # Upload ảnh sản phẩm (multipart) — route riêng, đứng TRƯỚC route products để được khớp trước.
            - id: product-images
              uri: ${PRODUCT_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/products/manage/*/images
                - Method=POST
              filters:
                - name: RequestSize
                  args:
                    maxSize: ${GATEWAY_MAX_UPLOAD_SIZE:6MB}
            - id: products
              uri: ${PRODUCT_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/products/**
              filters: *body-limit
            - id: cart
              uri: ${CART_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/cart/**
              filters: *body-limit
            - id: inventory
              uri: ${INVENTORY_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/inventory/**
              filters: *body-limit
            - id: wallet
              uri: ${PAYMENT_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/wallet/**
              filters: *body-limit
            - id: orders
              uri: ${ORDER_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/api/orders/**
              filters: *body-limit
            - id: reviews
              uri: ${REVIEW_SERVICE_URL:http://localhost:8088}
              predicates:
                - Path=/api/reviews/**
              filters: *body-limit
            # Chỉ chạy khi bật profile "search"; tắt thì route này trả lỗi kết nối — các luồng khác không ảnh hưởng.
            - id: search
              uri: ${SEARCH_SERVICE_URL:http://localhost:8087}
              predicates:
                - Path=/api/search/**
              filters: *body-limit
            # Tài liệu OpenAPI của từng service, phục vụ Swagger UI tổng hợp ở gateway (/swagger-ui.html).
            - id: docs-auth
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/docs/auth/v3/api-docs
              filters:
                - SetPath=/v3/api-docs
            - id: docs-product
              uri: ${PRODUCT_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/docs/product/v3/api-docs
              filters:
                - SetPath=/v3/api-docs
            - id: docs-cart
              uri: ${CART_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/docs/cart/v3/api-docs
              filters:
                - SetPath=/v3/api-docs
            - id: docs-inventory
              uri: ${INVENTORY_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/docs/inventory/v3/api-docs
              filters:
                - SetPath=/v3/api-docs
            - id: docs-payment
              uri: ${PAYMENT_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/docs/payment/v3/api-docs
              filters:
                - SetPath=/v3/api-docs
            - id: docs-order
              uri: ${ORDER_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/docs/order/v3/api-docs
              filters:
                - SetPath=/v3/api-docs
            - id: docs-search
              uri: ${SEARCH_SERVICE_URL:http://localhost:8087}
              predicates:
                - Path=/docs/search/v3/api-docs
              filters:
                - SetPath=/v3/api-docs
            - id: docs-review
              uri: ${REVIEW_SERVICE_URL:http://localhost:8088}
              predicates:
                - Path=/docs/review/v3/api-docs
              filters:
                - SetPath=/v3/api-docs

# Swagger UI tổng hợp: dropdown chọn service; "Try it out" gọi qua gateway (server mặc định trong mỗi spec).
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true
    urls-primary-name: order-service
    urls:
      - name: auth-service
        url: /docs/auth/v3/api-docs
      - name: product-service
        url: /docs/product/v3/api-docs
      - name: cart-service
        url: /docs/cart/v3/api-docs
      - name: inventory-service
        url: /docs/inventory/v3/api-docs
      - name: payment-service
        url: /docs/payment/v3/api-docs
      - name: order-service
        url: /docs/order/v3/api-docs
      - name: search-service
        url: /docs/search/v3/api-docs
      - name: review-service
        url: /docs/review/v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
    gateway:
      access: read-only
  metrics:
    tags:
      application: ${spring.application.name}

webshop:
  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER:webshop-auth}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
